name: EngineeringRule managed runtime

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/api/src/modules/evidence/**"
      - "apps/api/src/modules/classification/**"
      - "apps/api/src/modules/reconciliation/**"
      - "apps/api/src/modules/scan/**"
      - "apps/api/src/modules/legal-rule-catalog/**"
      - "packages/contracts/src/evidence/**"
      - "deepagents/tools/common/capabilities/agentic_evidence/**"
      - "deepagents/tools/common/llm/**"
      - "deepagents/tests/agentic_evidence/**"
      - "scripts/check-agentic-tool-runtime.mjs"
      - ".github/workflows/agentic-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-integrity:
    name: EngineeringRule runtime integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check API contract, handler, module and exposure wiring
        run: node scripts/check-agentic-tool-runtime.mjs

  worker-registry:
    name: Worker EngineeringRule runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepagents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install worker dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test fail-closed EngineeringRule runtime
        run: pytest tests/agentic_evidence
