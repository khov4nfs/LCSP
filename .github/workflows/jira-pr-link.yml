name: Jira PR Link

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  jira-link:
    name: Require Jira issue key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Jira issue key, link Jira issues, prefill Summary/Test plan, and close comment
        uses: actions/github-script@v9
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://minhpnq1807.atlassian.net' }}
          JIRA_PROJECT_KEY: LCSP
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- lcsp-jira-close-comment -->';
            const bodyMarkerStart = '<!-- lcsp-jira-links:start -->';
            const bodyMarkerEnd = '<!-- lcsp-jira-links:end -->';
            const jiraBaseUrl = process.env.JIRA_BASE_URL.replace(/\/$/, '');
            const projectKey = process.env.JIRA_PROJECT_KEY;
            const issueKeyPattern = new RegExp(`\\b${projectKey}-\\d+\\b`, 'gi');
            const pr = context.payload.pull_request;

            const issueKeys = [...new Set(
              (pr.title.match(issueKeyPattern) || []).map((key) => key.toUpperCase()),
            )];

            if (issueKeys.length === 0) {
              core.warning(
                `No Jira issue key detected in PR title. Skipping Jira link/prefill workflow. Add a ${projectKey}-123 style key to enable it.`,
              );
              return;
            }

            core.notice(`Detected Jira issue keys: ${issueKeys.join(', ')}`);

            // --- Task doc lookup: PR title Jira key -> docs/developer/jira-lcsp-push-result.csv -> docs/implementation/tasks ---

            function parseCsv(text) {
              const rows = [];
              let row = [];
              let field = '';
              let inQuotes = false;
              for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQuotes) {
                  if (c === '"') {
                    if (text[i + 1] === '"') {
                      field += '"';
                      i++;
                    } else {
                      inQuotes = false;
                    }
                  } else {
                    field += c;
                  }
                } else if (c === '"') {
                  inQuotes = true;
                } else if (c === ',') {
                  row.push(field);
                  field = '';
                } else if (c === '\n') {
                  row.push(field);
                  rows.push(row);
                  row = [];
                  field = '';
                } else if (c === '\r') {
                  // skip
                } else {
                  field += c;
                }
              }
              if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
              }
              const header = rows.shift() || [];
              return rows
                .filter((r) => r.length > 1)
                .map((r) => Object.fromEntries(header.map((h, idx) => [h, r[idx] ?? ''])));
            }

            function findTaskDocByTaskId(taskId) {
              const root = path.join(process.cwd(), 'docs', 'implementation', 'tasks', 'modules');
              const stack = [root];
              while (stack.length > 0) {
                const dir = stack.pop();
                let entries;
                try {
                  entries = fs.readdirSync(dir, { withFileTypes: true });
                } catch {
                  continue;
                }
                for (const entry of entries) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) {
                    stack.push(full);
                    continue;
                  }
                  if (!entry.name.endsWith('.md')) continue;
                  const content = fs.readFileSync(full, 'utf8');
                  const match = content.match(/^task_id:\s*(\S+)/m);
                  if (match && match[1] === taskId) {
                    return { filePath: full, content };
                  }
                }
              }
              return null;
            }

            // A Story-type Jira issue (e.g. "FEATURE: Story 1.3: ...") has no single task_id of
            // its own — it spans every Task doc marked with a matching `epic_story:` frontmatter
            // field (the CSV's `Parent` column only tracks Epic parentage, not Story, so it can't
            // be used for this lookup). Returns all matches, sorted by task_id for determinism.
            function findTaskDocsByEpicStory(storyNumber) {
              const root = path.join(process.cwd(), 'docs', 'implementation', 'tasks', 'modules');
              const stack = [root];
              const matches = [];
              while (stack.length > 0) {
                const dir = stack.pop();
                let entries;
                try {
                  entries = fs.readdirSync(dir, { withFileTypes: true });
                } catch {
                  continue;
                }
                for (const entry of entries) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) {
                    stack.push(full);
                    continue;
                  }
                  if (!entry.name.endsWith('.md')) continue;
                  const content = fs.readFileSync(full, 'utf8');
                  const match = content.match(/^epic_story:\s*(\S+)/m);
                  if (match && match[1] === storyNumber) {
                    matches.push({ filePath: full, content });
                  }
                }
              }
              matches.sort((a, b) => {
                const idA = (a.content.match(/^task_id:\s*(\S+)/m) || [])[1] || '';
                const idB = (b.content.match(/^task_id:\s*(\S+)/m) || [])[1] || '';
                return idA.localeCompare(idB);
              });
              return matches;
            }

            function parseFrontmatter(content) {
              const match = content.match(/^---\n([\s\S]*?)\n---/);
              const fm = {};
              if (match) {
                for (const line of match[1].split('\n')) {
                  const m = line.match(/^(\w+):\s*(.*)$/);
                  if (m) fm[m[1]] = m[2].trim();
                }
              }
              return fm;
            }

            function parseSection(content, heading) {
              const re = new RegExp(`## ${heading}\\n([\\s\\S]*?)(?=\\n## |$)`);
              const m = content.match(re);
              return m ? m[1].trim() : '';
            }

            function parseTable(section) {
              const lines = section.split('\n').filter((l) => l.trim().startsWith('|'));
              return lines
                .slice(2)
                .map((line) =>
                  line
                    .split('|')
                    .map((c) => c.trim())
                    .filter((c) => c.length > 0),
                )
                .filter((cells) => cells.length > 0);
            }

            let csvRows = [];
            try {
              const csvPath = path.join(process.cwd(), 'docs', 'developer', 'jira-lcsp-push-result.csv');
              csvRows = parseCsv(fs.readFileSync(csvPath, 'utf8'));
            } catch (error) {
              core.warning(`Could not read docs/developer/jira-lcsp-push-result.csv: ${error.message}`);
            }
            const csvByKey = Object.fromEntries(csvRows.map((row) => [row.Key, row]));

            function buildDocEntry(key, taskId, titleFallback, found) {
              const fm = parseFrontmatter(found.content);
              const titleMatch = found.content.match(/^# (.+)$/m);
              const title = titleMatch ? titleMatch[1].trim() : titleFallback;
              const outcome = parseSection(found.content, 'Outcome');
              const moduleFiles = parseTable(parseSection(found.content, 'Module Files'));
              const testCases = parseTable(parseSection(found.content, 'Test Cases'));
              return {
                key,
                taskId,
                title,
                module: fm.module || '',
                outcome,
                moduleFiles,
                testCases,
                docPath: path.relative(process.cwd(), found.filePath),
              };
            }

            // Every matched task doc across all detected Jira keys, in encounter order. A
            // Task-type key contributes at most one doc; a Story-type key can contribute several
            // (every task doc under that story), since a Story-level PR (this repo's `dev-story`
            // convention: one PR per story) implements multiple Jira Tasks at once.
            const allDocs = [];
            for (const key of issueKeys) {
              const csvRow = csvByKey[key];
              if (!csvRow) continue;
              const summary = csvRow.Summary || '';

              if (csvRow['Issue Type'] === 'Task') {
                const sepIndex = summary.indexOf(':');
                const taskId = sepIndex === -1 ? '' : summary.slice(0, sepIndex).trim();
                if (!taskId) continue;
                const found = findTaskDocByTaskId(taskId);
                if (!found) continue;
                allDocs.push(buildDocEntry(key, taskId, summary.slice(sepIndex + 1).trim(), found));
                continue;
              }

              if (csvRow['Issue Type'] === 'Story') {
                const storyMatch = summary.match(/^Story\s+(\d+(?:\.\d+)*)\s*:/i);
                if (!storyMatch) continue;
                const found = findTaskDocsByEpicStory(storyMatch[1]);
                for (const doc of found) {
                  const taskIdMatch = doc.content.match(/^task_id:\s*(\S+)/m);
                  allDocs.push(buildDocEntry(key, taskIdMatch ? taskIdMatch[1] : '', '', doc));
                }
              }
            }

            // Normalize CRLF: GitHub's PR template / web editor can hand back \r\n, which
            // breaks the `\n`-anchored section regexes below if left as-is.
            let currentBody = (pr.body || '').replace(/\r\n/g, '\n');

            // Fill the template's "Jira issue: LCSP-___" placeholder line, if present.
            // The underscore pattern only matches the unfilled placeholder, so this is a no-op
            // once a real key has been written there (by us or a human).
            currentBody = currentBody.replace(
              /Jira issue:\s*[A-Z]+-_+/i,
              `Jira issue: ${issueKeys.join(', ')}`,
            );

            // A section counts as "blank" (safe to auto-fill) if every non-empty line in it is
            // just a bare list marker with no text — i.e. the untouched PR-template placeholder
            // ("-"), not something a human actually wrote.
            function isBlankSection(text) {
              const lines = text
                .split('\n')
                .map((l) => l.trim())
                .filter((l) => l.length > 0);
              return lines.length === 0 || lines.every((l) => /^[-*]\s*(\[[ xX]\])?\s*$/.test(l));
            }

            // Replaces the body content under `## <heading>` with `newContent`, but only when
            // that section is currently blank/placeholder — never overwrites real human content,
            // and is naturally idempotent across re-runs (edited/synchronize) once filled once.
            function fillSectionIfBlank(body, heading, newContent) {
              // Stop the section at the next `## ` heading, the Jira-links marker block (already
              // present on a re-run), or end of string — otherwise a trailing section swallows the
              // marker comment and looks non-blank.
              const re = new RegExp(`(## ${heading}\\n)([\\s\\S]*?)(?=\\n## |\\n${bodyMarkerStart}|$)`);
              const m = body.match(re);
              if (!m) return { body, found: false, replaced: false };
              if (!isBlankSection(m[2])) return { body, found: true, replaced: false };
              const replacement = `${m[1]}\n${newContent}\n`;
              return { body: body.slice(0, m.index) + replacement + body.slice(m.index + m[0].length), found: true, replaced: true };
            }

            if (allDocs.length > 0) {
              const summaryLines = [];
              if (allDocs.length === 1) {
                const d = allDocs[0];
                summaryLines.push(`Implements **${d.taskId}: ${d.title}**${d.module ? ` (\`${d.module}\`)` : ''}.`);
                if (d.outcome) {
                  summaryLines.push('', d.outcome);
                }
                if (d.moduleFiles.length > 0) {
                  summaryLines.push('', 'Module files:');
                  for (const [file, action, notes] of d.moduleFiles) {
                    summaryLines.push(`- ${file} (${action}${notes ? ` — ${notes}` : ''})`);
                  }
                }
              } else {
                summaryLines.push(`Implements ${allDocs.length} tasks:`);
                for (const d of allDocs) {
                  summaryLines.push(
                    `- **${d.taskId}: ${d.title}**${d.module ? ` (\`${d.module}\`)` : ''}${d.outcome ? ` — ${d.outcome}` : ''}`,
                  );
                }
                const filesLines = allDocs.flatMap((d) =>
                  d.moduleFiles.map(([file, action, notes]) => `- ${file} (${action}${notes ? ` — ${notes}` : ''}) [${d.taskId}]`),
                );
                if (filesLines.length > 0) {
                  summaryLines.push('', 'Module files:', ...filesLines);
                }
              }

              const checklistLines = allDocs.flatMap((d) =>
                d.testCases.length > 0
                  ? d.testCases.map(([id, scenario, expected]) => `- [ ] ${id}: ${scenario} — ${expected}`)
                  : [`- [ ] Manually verify against \`${d.docPath}\``],
              );
              const taskSummary = allDocs.map((d) => `${d.taskId}: ${d.title}`).join('; ');
              const closesLine = `Closes ${issueKeys.join(', ')} (${taskSummary}).`;
              const verificationContent = `${checklistLines.join('\n')}\n\n${closesLine}`;
              const docPaths = [...new Set(allDocs.map((d) => d.docPath))];

              const summaryResult = fillSectionIfBlank(currentBody, 'Summary', summaryLines.join('\n'));
              currentBody = summaryResult.body;

              // Support either heading name: this repo's template says "Verification"; fall back
              // to "Test plan" if a body already uses that instead.
              let verificationResult = fillSectionIfBlank(currentBody, 'Verification', verificationContent);
              if (!verificationResult.found) {
                verificationResult = fillSectionIfBlank(currentBody, 'Test plan', verificationContent);
              }
              currentBody = verificationResult.body;

              if (summaryResult.replaced || verificationResult.replaced) {
                core.notice(
                  `Prefilled Summary/Verification from ${docPaths.join(', ')}. Fill in real verification results before merge.`,
                );
              } else if (!summaryResult.found && !verificationResult.found) {
                // Body doesn't follow the template at all (no Summary/Verification headings) —
                // fall back to prepending a full generated block, same as a from-scratch PR.
                const generatedSection = [
                  '## Summary',
                  '',
                  summaryLines.join('\n'),
                  '',
                  '## Verification',
                  '',
                  verificationContent,
                ].join('\n');
                core.notice(
                  `No Summary/Verification headings found in PR body — prepending a full block from ${docPaths.join(', ')}.`,
                );
                currentBody = currentBody.trim().length > 0
                  ? `${generatedSection}\n\n${currentBody.trim()}`
                  : generatedSection;
              } else {
                core.notice(
                  'Summary/Verification sections already have content — leaving them as-is.',
                );
              }
            } else {
              core.notice(
                'No matching task doc found under docs/implementation/tasks for the detected Jira key(s) — skipping Summary/Verification prefill.',
              );
            }

            const issueLinks = issueKeys
              .map((key) => `- [${key}](${jiraBaseUrl}/browse/${key})`)
              .join('\n');

            const jiraLinksSection = `${bodyMarkerStart}
            ## Jira issues

            ${issueLinks}
            ${bodyMarkerEnd}`.replace(/^ {12}/gm, '').trim();

            const markerPattern = new RegExp(
              `${bodyMarkerStart}[\\s\\S]*?${bodyMarkerEnd}`,
            );
            const nextBody = markerPattern.test(currentBody)
              ? currentBody.replace(markerPattern, jiraLinksSection)
              : `${currentBody.trim()}\n\n${jiraLinksSection}`.trim();

            if (nextBody !== (pr.body || '').replace(/\r\n/g, '\n')) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: nextBody,
              });
              core.notice('Updated PR body with clickable Jira issue links.');
            }

            if (context.payload.action !== 'closed') {
              return;
            }

            const state = pr.merged ? 'merged' : 'closed without merge';
            const body = `${marker}
            ## Jira closure

            PR #${pr.number} was ${state}.

            ${issueLinks}
            `.replace(/^ {12}/gm, '').trim();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
