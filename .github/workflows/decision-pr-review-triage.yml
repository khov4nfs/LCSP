name: LCSP Decision PR Review Triage Recorder

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  record-pr-review-triage:
    name: Trusted PR review shadow triage recorder
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install Python worker dependencies
        working-directory: deepagents
        run: python -m pip install -e ".[dev]"

      - name: Download bounded PR-review packet artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_ARTIFACT_NAME: lcsp336-pr-review-shadow-packet-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
        run: gh run download "$SOURCE_RUN_ID" --name "$EXPECTED_ARTIFACT_NAME" --dir artifacts-in || true

      - name: Record typed PR-review shadow triage
        working-directory: deepagents
        env:
          GH_TOKEN: ${{ github.token }}
          LCSP_DECISION_PROVIDER: jev
          LCSP_DECISION_MODE: shadow
          LCSP_DECISION_FALLBACK: existing
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LCSP_API_BASE_URL: ${{ vars.LCSP_API_BASE_URL }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
          EXPECTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          mkdir -p ../artifacts/decision
          packet="../artifacts-in/pr-review-triage-packet.json"
          if [ ! -f "$packet" ]; then
            printf '%s\n' '{"recordingStatus":"TYPED_RESULT_NOT_RECORDED_PACKET_MISSING","typedResultRecorded":false}' > ../artifacts/decision/pr-review-triage-record.json
            exit 0
          fi
          if [ -z "$EXPECTED_PR_NUMBER" ] || [ -z "$EXPECTED_HEAD_SHA" ] || [ -z "$EXPECTED_BASE_SHA" ]; then
            printf '%s\n' '{"recordingStatus":"TYPED_RESULT_NOT_RECORDED_TRUSTED_CORRELATION_UNAVAILABLE","typedResultRecorded":false}' > ../artifacts/decision/pr-review-triage-record.json
            exit 0
          fi
          trusted_compare="../artifacts/decision/trusted-compare.json"
          trusted_pr="../artifacts/decision/trusted-pr.json"
          if ! gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_BASE_SHA...$EXPECTED_HEAD_SHA" > "$trusted_compare"; then
            printf '%s\n' '{"recordingStatus":"TYPED_RESULT_NOT_RECORDED_TRUSTED_METADATA_UNAVAILABLE","typedResultRecorded":false,"trustedMetadataError":"GITHUB_COMPARE_UNAVAILABLE"}' > ../artifacts/decision/pr-review-triage-record.json
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER" > "$trusted_pr"; then
            printf '%s\n' '{"recordingStatus":"TYPED_RESULT_NOT_RECORDED_TRUSTED_METADATA_UNAVAILABLE","typedResultRecorded":false,"trustedMetadataError":"GITHUB_PR_UNAVAILABLE"}' > ../artifacts/decision/pr-review-triage-record.json
            exit 0
          fi
          trusted_domain="$(
            python -c 'from decision.pr_review_triage import infer_authoritative_domain; import json, sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print(infer_authoritative_domain(tuple(item["filename"] for item in data.get("files", []) if item.get("filename"))))' "$trusted_compare"
          )"
          trusted_title="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("title") or "")' "$trusted_pr")"
          trusted_head_ref="$(python -c 'import json, sys; data=json.load(open(sys.argv[1], encoding="utf-8")); print((data.get("head") or {}).get("ref") or "")' "$trusted_pr")"
          python -m decision.pr_review_triage \
            --record-packet "$packet" \
            --require-durable \
            --require-trusted-metadata \
            --expected-pr-number "$EXPECTED_PR_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-base-sha "$EXPECTED_BASE_SHA" \
            --trusted-authoritative-domain "$trusted_domain" \
            --trusted-compare-json "$trusted_compare" \
            --trusted-pr-title "$trusted_title" \
            --trusted-head-ref "$trusted_head_ref" \
            --trusted-review-run-id "${{ github.event.workflow_run.id }}" \
            --trusted-ci-state-code "workflow:${{ github.event.workflow_run.name }}" \
            --trusted-ci-state-code "conclusion:${{ github.event.workflow_run.conclusion }}" \
            --output "../artifacts/decision/pr-review-triage-record.json"

      - name: Upload trusted PR-review shadow triage record
        uses: actions/upload-artifact@v4
        with:
          name: lcsp336-pr-review-shadow-record-${{ github.event.workflow_run.id }}
          path: artifacts/decision/
          if-no-files-found: error
          retention-days: 14
