name: autofix.ci

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      api_files: ${{ steps.filter.outputs.api_files }}
      web: ${{ steps.filter.outputs.web }}
      web_files: ${{ steps.filter.outputs.web_files }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest commit message
        if: github.event_name == 'pull_request'
        run: |
          git log -1 --format=%B "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/latest-commit-message.txt"
          node scripts/check-commit-message.mjs "$RUNNER_TEMP/latest-commit-message.txt"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Pull-request mode normally calls the changed-files REST API. Use
          # the checked-out git history instead so transient GitHub API 5xx
          # responses cannot fail change detection.
          token: ""
          list-files: shell
          filters: |
            api:
              - '.github/workflows/check-changed.yml'
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'scripts/check-branch-name.mjs'
              - 'scripts/check-import-policy.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            web:
              - '.github/workflows/check-changed.yml'
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/i18n/**'
              - 'scripts/check-branch-name.mjs'
              - 'scripts/check-import-policy.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            python:
              - '.github/workflows/check-changed.yml'
              - 'deepagents/**'

  autofix:
    name: Auto-fix imports and lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Auto-fix import policy
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
        run: pnpm run check:imports -- --fix
        env:
          IMPORT_POLICY_FILES: |
            ${{ needs.changes.outputs.api_files }}
            ${{ needs.changes.outputs.web_files }}

      - name: Generate Prisma client
        if: needs.changes.outputs.api == 'true'
        run: pnpm --filter @lcsp/api prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lcsp_api_test?schema=public

      - name: Auto-fix API lint
        if: needs.changes.outputs.api == 'true'
        continue-on-error: true
        run: |
          files="$(printf '%s\n' ${{ needs.changes.outputs.api_files }} | awk '/^apps\/api\/.*\.(ts|tsx)$/ { sub("^apps/api/", ""); print }' | while IFS= read -r file; do [ -f "apps/api/$file" ] && printf '%s\n' "$file"; done)"
          if [ -n "$files" ]; then
            pnpm --dir apps/api exec eslint $files --fix
          fi

      - name: Auto-fix web lint
        if: needs.changes.outputs.web == 'true'
        continue-on-error: true
        run: |
          files="$(printf '%s\n' ${{ needs.changes.outputs.web_files }} | awk '/^apps\/web\/.*\.(ts|tsx)$/ { sub("^apps/web/", ""); print }' | while IFS= read -r file; do [ -f "apps/web/$file" ] && printf '%s\n' "$file"; done)"
          if [ -n "$files" ]; then
            pnpm --dir apps/web exec eslint $files --fix
          fi

      - name: Resolve autofix Jira key
        id: autofix_ticket
        if: github.event_name == 'pull_request' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ticket="$(printf '%s\n' "$PR_TITLE" | grep -oE 'LCSP-[0-9]+' | head -n 1)"
          if [ -z "$ticket" ]; then
            echo "Unable to resolve LCSP Jira key from PR title: $PR_TITLE" >&2
            exit 1
          fi
          echo "ticket=$ticket" >> "$GITHUB_OUTPUT"

      - name: Commit auto-fixes
        if: github.event_name == 'pull_request' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
        uses: autofix-ci/action@v1
        with:
          commit-message: "ci: ${{ steps.autofix_ticket.outputs.ticket }} auto-fix imports and lint"

      - name: Verify auto-fixes are committed
        if: github.event_name != 'pull_request' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
        run: git diff --exit-code

  api:
    name: API checks
    needs: [changes, autofix]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check branch name
        run: pnpm run check:branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Check import policy
        run: pnpm run check:imports

      - name: Build runtime contracts
        run: pnpm --filter @lcsp/contracts build

      - name: Generate Prisma client
        run: pnpm --filter @lcsp/api prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lcsp_api_test?schema=public

      - name: Lint API
        run: |
          files="$(printf '%s\n' ${{ needs.changes.outputs.api_files }} | awk '/^apps\/api\/.*\.(ts|tsx)$/ { sub("^apps/api/", ""); print }' | while IFS= read -r file; do [ -f "apps/api/$file" ] && printf '%s\n' "$file"; done)"
          if [ -n "$files" ]; then
            pnpm --dir apps/api exec eslint $files
          else
            echo "No changed API TypeScript files to lint."
          fi

      - name: Build API
        run: pnpm --filter @lcsp/api build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lcsp_api_test?schema=public

  web:
    name: Web checks
    needs: [changes, autofix]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check branch name
        run: pnpm run check:branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Check import policy
        run: pnpm run check:imports

      - name: Build runtime contracts
        run: pnpm --filter @lcsp/contracts build

      - name: Lint web
        run: |
          files="$(printf '%s\n' ${{ needs.changes.outputs.web_files }} | awk '/^apps\/web\/.*\.(ts|tsx)$/ { sub("^apps/web/", ""); print }' | while IFS= read -r file; do [ -f "apps/web/$file" ] && printf '%s\n' "$file"; done)"
          if [ -n "$files" ]; then
            pnpm --dir apps/web exec eslint $files
          else
            echo "No changed web TypeScript files to lint."
          fi

      - name: Build web
        run: pnpm --filter @lcsp/web build

  python:
    name: Python worker checks
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepagents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
