name: Tests

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect test areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          list-files: shell
          filters: |
            api:
              - '.github/workflows/test.yml'
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            web:
              - '.github/workflows/test.yml'
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/i18n/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            python:
              - '.github/workflows/test.yml'
              - 'deepagents/**'

  api-unit:
    name: API unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      LCSP_TEST_POSTGRES_PORT: 55435
      LCSP_TEST_POSTGRES_DB: lcsp_api_test
      LCSP_TEST_POSTGRES_USER: postgres
      LCSP_TEST_POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55435/lcsp_api_test?schema=public
      INTERVIEW_GUIDANCE_VERSION: interview-guidance-ci-v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lcsp/api prisma:generate

      - name: Start PostgreSQL test database
        run: node apps/api/test/scripts/ensure-test-postgres.mjs

      - name: Apply Prisma migrations
        run: pnpm --filter @lcsp/api exec prisma migrate deploy

      - name: Test API
        run: pnpm --filter @lcsp/api test

  api-e2e:
    name: API e2e tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      INTERVIEW_GUIDANCE_VERSION: interview-guidance-ci-v1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcsp_api_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lcsp_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API e2e
        run: pnpm --filter @lcsp/api test:e2e

  web:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web
        run: pnpm run test:web

  python:
    name: Python worker tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcsp_worker_test
        ports:
          - 55436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lcsp_worker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LCSP_TEST_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55436/lcsp_worker_test
    defaults:
      run:
        working-directory: deepagents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test Python workers
        run: pytest

  lcsp-278-production-vertical:
    name: Production Interview vertical
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcsp_api_release_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lcsp_api_release_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_api_release_test?schema=public
      LCSP_API_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_api_release_test?schema=public
      LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_checkpoint_release_test
      LCSP_TEST_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_checkpoint_release_test
      LCSP_API_BASE_URL: http://127.0.0.1:3101
      WORKER_API_KEY: test-only-worker-api-key-at-least-32-chars
      PORT: 3101
      NODE_ENV: test
      JWT_SECRET: test-only-jwt-secret-at-least-32-characters-long
      OAUTH_ALLOWED_REDIRECT_URIS: http://localhost:3000/auth/callback
      GITHUB_APP_SLUG: lcsp-app-test
      GITHUB_APP_ID: 123456
      GITHUB_APP_PRIVATE_KEY: test-only-private-key
      GITHUB_APP_ALLOWED_REDIRECT_URIS: http://localhost:3000/github/callback
      GITHUB_APP_CLIENT_ID: test-github-app-client-id
      GITHUB_APP_CLIENT_SECRET: test-github-app-client-secret
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
      MFA_SECRET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      LEGAL_CHROMA_PATH: /tmp/lcsp-278-release-chroma
      LCSP_SNAPSHOT_ARCHIVE_CACHE_DIR: /tmp/lcsp-278-release-snapshot-cache
      INTERVIEW_GUIDANCE_VERSION: interview-guidance-ci-v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Create checkpoint database
        run: docker exec ${{ job.services.postgres.id }} createdb -U postgres lcsp_checkpoint_release_test

      - name: Generate Prisma client
        run: pnpm --filter @lcsp/api prisma:generate

      - name: Apply disposable API schema
        run: pnpm --filter @lcsp/api exec prisma db push --accept-data-loss --force-reset

      - name: Seed release vertical starting state
        run: pnpm --filter @lcsp/api exec tsx test/scripts/seed-lcsp-278-release-vertical.ts

      - name: Install Python worker dependencies
        working-directory: deepagents
        run: python -m pip install -e ".[dev]"

      - name: Start Nest API
        run: |
          pnpm --filter @lcsp/api start > /tmp/lcsp-278-api.log 2>&1 &
          echo $! > /tmp/lcsp-278-api.pid
          for attempt in {1..60}; do
            if curl -fsS "$LCSP_API_BASE_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lcsp-278-api.log
          exit 1

      - name: Test production release vertical
        working-directory: deepagents
        run: pytest tests/test_assessment_interview_production_vertical.py -q

      - name: Stop Nest API
        if: always()
        run: |
          if [ -f /tmp/lcsp-278-api.pid ]; then
            kill "$(cat /tmp/lcsp-278-api.pid)" || true
          fi
