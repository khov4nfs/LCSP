name: Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect test areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
      release_gate: ${{ steps.filter.outputs.release_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ""
          list-files: shell
          filters: |
            api:
              - '.github/workflows/test.yml'
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'frozen/interview-agent-frozen/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            web:
              - '.github/workflows/test.yml'
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/i18n/**'
              - 'frozen/interview-agent-frozen/**'
              - 'tests/**'
              - 'docs/operations/lcsp-333-managed-sandbox-release-gate.md'
              - 'scripts/check-managed-sandbox-release-gate.mjs'
              - 'scripts/check-managed-sandbox-release-gate.test.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            python:
              - '.github/workflows/test.yml'
              - 'deepagents/**'
              - 'frozen/interview-agent-frozen/**'
            release_gate:
              - '.github/workflows/test.yml'
              - 'docs/operations/lcsp-333-managed-sandbox-release-gate.md'
              - 'scripts/check-managed-sandbox-release-gate.mjs'
              - 'scripts/check-managed-sandbox-release-gate.test.mjs'
              - 'apps/api/**'
              - 'apps/web/**'
              - 'deepagents/**'
              - 'frozen/interview-agent-frozen/**'
              - 'packages/contracts/**'
              - 'packages/i18n/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'

  release-gate-static:
    name: Release gate static checks
    needs: changes
    if: needs.changes.outputs.release_gate == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lcsp_api_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Check import policy
        run: pnpm run check:imports

      - name: Check contract literals
        run: pnpm run check:contracts

      - name: Check billing production data sources
        run: pnpm run check:billing-release-gate

      - name: Check managed sandbox release gate validator
        run: pnpm run test:managed-sandbox-release-gate

  decision-pr-review-triage:
    name: PR review shadow triage packet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install Python worker dependencies
        working-directory: deepagents
        run: python -m pip install -e ".[dev]"

      - name: Build bounded PR-review shadow triage packet
        working-directory: deepagents
        run: >-
          python -m decision.pr_review_triage
          --packet-only
          --pr-number "${{ github.event.pull_request.number }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --output "../artifacts/decision/pr-review-triage-packet.json"

      - name: Upload PR-review shadow triage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcsp336-pr-review-shadow-packet-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/decision/
          if-no-files-found: error
          retention-days: 14

  managed-sandbox-release-gate:
    name: Managed sandbox proof
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.release_gate == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.LCSP_MANAGED_SANDBOX_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, lcsp-managed-sandbox]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Execute trusted producer and pre-upload verifier
        env:
          LCSP333_PR_NUMBER: ${{ github.event.pull_request.number }}
          LCSP333_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LCSP333_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LCSP333_TRIGGER_ID: ${{ github.event.pull_request.id }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          rm -rf "$RUNNER_TEMP/lcsp333-proof"
          mkdir -p "$RUNNER_TEMP/lcsp333-proof"
          lcsp-managed-sandbox-proof             --repository "$GITHUB_REPOSITORY"             --pr "$LCSP333_PR_NUMBER"             --base "$LCSP333_BASE_SHA"             --head "$LCSP333_HEAD_SHA"             --trigger "$LCSP333_TRIGGER_ID"             --out "$RUNNER_TEMP/lcsp333-proof/lcsp333-managed-sandbox-proof.json"
          lcsp-managed-sandbox-verify             --proof "$RUNNER_TEMP/lcsp333-proof/lcsp333-managed-sandbox-proof.json"             --expected-pr "$LCSP333_PR_NUMBER"             --expected-base "$LCSP333_BASE_SHA"             --expected-head "$LCSP333_HEAD_SHA"             --out "$RUNNER_TEMP/lcsp333-proof/lcsp333-managed-sandbox-gate-result.json"

      - name: Upload privacy-verified proof and trusted gate result
        uses: actions/upload-artifact@v4
        with:
          name: lcsp333-trusted-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/lcsp333-proof/lcsp333-managed-sandbox-proof.json
            ${{ runner.temp }}/lcsp333-proof/lcsp333-managed-sandbox-gate-result.json
          if-no-files-found: error
          retention-days: 14

  managed-sandbox-readiness:
    name: Managed sandbox readiness diagnostic
    needs: [changes, managed-sandbox-release-gate]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record non-applicable readiness
        if: needs.changes.outputs.release_gate != 'true'
        run: |
          echo "Managed sandbox diagnostic: NOT_APPLICABLE (release-gate surface not selected)."

      - name: Require trusted managed-sandbox proof for same-repository PR
        if: >-
          needs.changes.outputs.release_gate == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRODUCER_RESULT: ${{ needs.managed-sandbox-release-gate.result }}
          MANAGED_SANDBOX_RUNNER_ENABLED: ${{ vars.LCSP_MANAGED_SANDBOX_RUNNER_ENABLED }}
        run: |
          if [ "$PRODUCER_RESULT" = "success" ]; then
            echo "Managed sandbox diagnostic: proof artifact is available for exact-head validation."
            exit 0
          fi

          if [ "$PRODUCER_RESULT" = "skipped" ] && [ "$MANAGED_SANDBOX_RUNNER_ENABLED" != "true" ]; then
            echo "::warning::Managed sandbox diagnostic: BLOCKED_NO_RUNNER. The repository variable LCSP_MANAGED_SANDBOX_RUNNER_ENABLED is not true, so the PR-owned proof job was not scheduled."
            echo "::warning::This diagnostic is non-authoritative and cannot satisfy Managed sandbox readiness gate. A trusted external/protected control plane must publish proof, NOT_APPLICABLE, or a governed exemption."
            exit 0
          fi

          echo "No trusted managed-sandbox proof is available for this exact head."
          echo "A governed exemption must be supplied by a trusted external workflow/service; this PR workflow cannot mint one."
          exit 1

      - name: Download trusted proof gate result
        if: >-
          needs.changes.outputs.release_gate == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.managed-sandbox-release-gate.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: lcsp333-trusted-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts

      - name: Verify immutable trusted proof outcome
        if: >-
          needs.changes.outputs.release_gate == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.managed-sandbox-release-gate.result == 'success'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync("artifacts/lcsp333-managed-sandbox-gate-result.json", "utf8"));
            if (result.ok !== true) throw new Error("trusted managed-sandbox gate did not pass");
            const head = result.summary?.headSha ?? result.headSha;
            if (head !== process.env.EXPECTED_HEAD_SHA) throw new Error("trusted gate result is not for exact PR head");
            if (!result.verifierVersion && !result.verifierHash) throw new Error("trusted verifier identity is missing");
          '

      - name: Fail closed for fork PR without external governed exemption
        if: >-
          needs.changes.outputs.release_gate == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning::Managed sandbox diagnostic: BLOCKED_FORK. Fork PRs never schedule the privileged managed-sandbox runner."
          echo "::warning::A trusted external governance workflow/service must publish the required readiness status for proof, NOT_APPLICABLE, or an approved exemption."

  web-production-build:
    name: Web lint and production build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @lcsp/web lint

      - name: Build web
        run: pnpm --filter @lcsp/web build

  api-unit:
    name: API unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      LCSP_TEST_POSTGRES_PORT: 55435
      LCSP_TEST_POSTGRES_DB: lcsp_api_test
      LCSP_TEST_POSTGRES_USER: postgres
      LCSP_TEST_POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55435/lcsp_api_test?schema=public
      INTERVIEW_GUIDANCE_VERSION: interview-guidance-ci-v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lcsp/api prisma:generate

      - name: Start PostgreSQL test database
        run: node apps/api/test/scripts/ensure-test-postgres.mjs

      - name: Apply Prisma migrations
        run: pnpm --filter @lcsp/api exec prisma migrate deploy

      - name: Test API
        run: pnpm --filter @lcsp/api test

  api-e2e:
    name: API e2e tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      INTERVIEW_GUIDANCE_VERSION: interview-guidance-ci-v1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcsp_api_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lcsp_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API e2e
        run: pnpm --filter @lcsp/api test:e2e

  web:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web
        run: pnpm run test:web

  python:
    name: Python worker tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcsp_worker_test
        ports:
          - 55436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lcsp_worker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LCSP_TEST_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55436/lcsp_worker_test
    defaults:
      run:
        working-directory: deepagents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test Python workers
        run: pytest

  lcsp-278-production-vertical:
    name: Production Interview vertical
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcsp_api_release_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lcsp_api_release_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_api_release_test?schema=public
      LCSP_API_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_api_release_test?schema=public
      LANGGRAPH_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_checkpoint_release_test
      LCSP_TEST_CHECKPOINT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55437/lcsp_checkpoint_release_test
      LCSP_API_BASE_URL: http://127.0.0.1:3101
      WORKER_API_KEY: test-only-worker-api-key-at-least-32-chars
      PORT: 3101
      NODE_ENV: test
      JWT_SECRET: test-only-jwt-secret-at-least-32-characters-long
      OAUTH_ALLOWED_REDIRECT_URIS: http://localhost:3000/auth/callback
      GITHUB_APP_SLUG: lcsp-app-test
      GITHUB_APP_ID: 123456
      GITHUB_APP_PRIVATE_KEY: test-only-private-key
      GITHUB_APP_ALLOWED_REDIRECT_URIS: http://localhost:3000/github/callback
      GITHUB_APP_CLIENT_ID: test-github-app-client-id
      GITHUB_APP_CLIENT_SECRET: test-github-app-client-secret
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
      MFA_SECRET_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      LEGAL_CHROMA_PATH: /tmp/lcsp-278-release-chroma
      LCSP_SNAPSHOT_ARCHIVE_CACHE_DIR: /tmp/lcsp-278-release-snapshot-cache
      INTERVIEW_GUIDANCE_VERSION: interview-guidance-ci-v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Create checkpoint database
        run: docker exec ${{ job.services.postgres.id }} createdb -U postgres lcsp_checkpoint_release_test

      - name: Generate Prisma client
        run: pnpm --filter @lcsp/api prisma:generate

      - name: Apply disposable API schema
        run: pnpm --filter @lcsp/api exec prisma db push --accept-data-loss --force-reset

      - name: Seed release vertical starting state
        run: pnpm --filter @lcsp/api exec tsx test/scripts/seed-lcsp-278-release-vertical.ts

      - name: Install Python worker dependencies
        working-directory: deepagents
        run: python -m pip install -e ".[dev]"

      - name: Start Nest API
        run: |
          pnpm --filter @lcsp/api start > /tmp/lcsp-278-api.log 2>&1 &
          echo $! > /tmp/lcsp-278-api.pid
          for attempt in {1..60}; do
            if curl -fsS "$LCSP_API_BASE_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lcsp-278-api.log
          exit 1

      - name: Test production release vertical
        working-directory: deepagents
        run: pytest tests/test_assessment_interview_production_vertical.py -q

      - name: Stop Nest API
        if: always()
        run: |
          if [ -f /tmp/lcsp-278-api.pid ]; then
            kill "$(cat /tmp/lcsp-278-api.pid)" || true
          fi

  admin-playwright-e2e:
    name: Billing and Admin Playwright E2E release gate
    needs: changes
    if: needs.changes.outputs.release_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Build runtime packages
        run: pnpm run build:runtime-packages

      - name: Run Billing and Admin Playwright E2E tests
        run: pnpm run test:billing:e2e
