name: Tests

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect test areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          list-files: shell
          filters: |
            api:
              - '.github/workflows/test.yml'
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            web:
              - '.github/workflows/test.yml'
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/i18n/**'
              - 'tests/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            python:
              - '.github/workflows/test.yml'
              - 'deepagents/**'

  api-unit:
    name: API unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      LCSP_TEST_POSTGRES_PORT: 55435
      LCSP_TEST_POSTGRES_DB: lcsp_api_test
      LCSP_TEST_POSTGRES_USER: postgres
      LCSP_TEST_POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55435/lcsp_api_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lcsp/api prisma:generate

      - name: Start PostgreSQL test database
        run: node apps/api/test/scripts/ensure-test-postgres.mjs

      - name: Apply Prisma migrations
        run: pnpm --filter @lcsp/api exec prisma migrate deploy

      - name: Test API
        run: pnpm --filter @lcsp/api test

  api-e2e:
    name: API e2e tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lcsp_api_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lcsp_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API e2e
        run: pnpm --filter @lcsp/api test:e2e

  web:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web
        run: pnpm run test:web

  python:
    name: Python worker tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepagents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deepagents/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test Python workers
        run: pytest
