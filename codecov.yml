codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "70...90"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

github_checks:
  annotations: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

flags:
  api:
    paths:
      - apps/api/src/
    carryforward: true
