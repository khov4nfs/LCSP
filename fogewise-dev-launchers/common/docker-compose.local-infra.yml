services:
  fogewise-postgres:
    image: postgres:17-alpine
    container_name: fogewise-postgres
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: fogewise
      POSTGRES_PASSWORD: ${LCSP_LOCAL_POSTGRES_PASSWORD:?Set LCSP_LOCAL_POSTGRES_PASSWORD in the private common/.env file}
      POSTGRES_DB: lcsp_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fogewise -d lcsp_dev",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - fogewise-postgres-data:/var/lib/postgresql/data
    networks:
      - fogewise-local-dev

  fogewise-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fogewise-rabbitmq
    mem_limit: 512m
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: fogewise
      RABBITMQ_DEFAULT_PASS: ${LCSP_LOCAL_RABBITMQ_PASSWORD:?Set LCSP_LOCAL_RABBITMQ_PASSWORD in the private common/.env file}
      # Agent runs are not time-bounded (they take as long as model reasoning
      # needs), so a held delivery must never be reclaimed by the broker.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout undefined"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fogewise-local-dev

  fogewise-redis:
    image: redis:7.4-alpine
    container_name: fogewise-redis
    mem_limit: 128m
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${LCSP_LOCAL_REDIS_PASSWORD:?Set LCSP_LOCAL_REDIS_PASSWORD in the private common/.env file}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-e",
          "--no-auth-warning",
          "-a",
          "${LCSP_LOCAL_REDIS_PASSWORD:?Set LCSP_LOCAL_REDIS_PASSWORD in the private common/.env file}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - fogewise-redis-data:/data
    networks:
      - fogewise-local-dev

networks:
  fogewise-local-dev:
    name: fogewise-local-dev

volumes:
  fogewise-postgres-data:
  fogewise-redis-data:
