[project]
name = "lcsp-agent-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
  "httpx==0.28.1",
  "requests>=2.32.0,<3.0.0",
  "pika==1.3.2",
  "certifi>=2025.0.0",
  "structlog==24.4.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "pydantic>=2.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "boto3>=1.34.144",
  "deepagents>=0.7.16,<0.8.0",
  "langchain[openai,anthropic,google-genai,mcp]>=1.0.0",
  "langchain-core>=1.0.0",
  "langgraph>=0.2.0",
  "langgraph-sdk>=0.4.2,<0.5.0",
  "langgraph-checkpoint-postgres==3.1.0",
  "starlette>=1.3.1,<2.0.0",
  "arize-phoenix-otel>=0.17.0",
  "opentelemetry-api>=1.0.0",
  "psycopg[binary]==3.3.4",
  "urllib3>=2.2.0,<3.0.0",
  "chromadb==1.5.5",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4.31",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "pytest-mock==3.14.0",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "tools",
  "runtime",
]
