[project]
name = "lcsp-agent-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
  "httpx==0.28.1",
  "requests>=2.32.0,<3.0.0",
  "pika==1.3.2",
  "certifi>=2025.0.0",
  "structlog==24.4.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "pydantic>=2.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "boto3>=1.34.144",
  "deepagents==0.7.17",
  "langchain[openai,anthropic,google-genai,mcp]==1.4.2",
  "langchain-core==1.6.4",
  "langgraph==1.2.18",
  "langgraph-sdk>=0.4.4,<0.5.0",
  "langgraph-checkpoint-postgres==3.1.3",
  "starlette>=1.3.1,<2.0.0",
  "arize-phoenix-otel>=0.17.0",
  "opentelemetry-api>=1.45.1,<2",
  "psycopg[binary]==3.3.4",
  "urllib3>=2.8.0,<3.0.0",
  "chromadb==1.5.9",
  "pyyaml>=6.0,<7.0",
  "pypdf>=6.21.4,<7",
]

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]>=0.4.32",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-mock==3.14.0",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "tools",
]

[tool.uv]
# Security floors for existing transitive authentication and development-server dependencies.
constraint-dependencies = ["pyasn1>=0.6.5", "oauthlib>=4.0.1", "joserfc>=1.7.6", "langgraph-api>=0.15.12"]
