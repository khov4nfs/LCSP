# Model routing: the single authority for which model every agent role uses.
# This configuration uses one official Anthropic model and intentionally defines no fallbacks.
version: 1

routes:
  anthropic-primary:
    provider: anthropic
    model: claude-sonnet-5-5
    options:
      context_window_tokens: 1000000
      max_output_tokens: 65536
      streaming: true

roles:
  default: anthropic-primary
  root: anthropic-primary
  assessment-root: anthropic-primary
  repository-researcher: anthropic-primary
  rule-set-preparation: anthropic-primary
  response-transform: anthropic-primary
  claim-author: anthropic-primary
