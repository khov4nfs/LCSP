# Model routing: the single authority for which model every agent role uses.
# Override the location with LCSP_MODEL_ROUTES_FILE. Credentials and pricing are NOT here
# (credentials: provider env vars; pricing: billing). Model ids are opaque strings, kept as written.
version: 1

# A route = canonical provider + protocol + opaque model id (+ optional inference options).
# provider must be exactly one of: openai, anthropic, google_genai, inception, apx, miraiapi.
# protocol is the native API family; APX and Mirai API accept anthropic or openai.
# options (e.g. temperature, reasoning, max_output_tokens, context_window_tokens) are passed through;
# omit them to get provider defaults. Credential/endpoint/header-like keys are rejected.
routes:
  # max_output_tokens is the per-call output ceiling (code default: 4096). The preparation packet and
  # the Legal Source Reader results are single tool calls larger than that and were silently truncated.
  # Each value is the provider model's own output limit, not a workload budget.
  # streaming keeps bytes flowing during a multi-minute generation: a silent non-streaming
  # request that a gateway drops hangs until the provider timeout (3600 s) instead of failing fast.
  primary:
    provider: miraiapi
    protocol: anthropic
    model: claude-sonnet-5
    options:
      streaming: true
  fallback:
    provider: inception
    model: mercury-2.5
    options:
      max_output_tokens: 32768
      streaming: true
  fallback-01:
    provider: google_genai
    model: gemini-3.5-flash-lite
    options:
      max_output_tokens: 65536
      streaming: true
  fallback-02:
    provider: apx
    protocol: anthropic
    model: claude-sonnet-4-6-free
    options:
      max_output_tokens: 64000
      streaming: true
  semantic-primary:
    provider: miraiapi
    protocol: anthropic
    model: claude-sonnet-5
    options:
      streaming: true
  semantic-final:
    provider: apx
    protocol: anthropic
    model: claude-sonnet-4-6-free
    options:
      max_output_tokens: 64000
      streaming: true
      thinking:
        type: adaptive
      effort: high

# Role -> route. `default` is required and used for any role not listed.
roles:
  default: primary
  root: primary
  assessment-root: primary
  repository-researcher: primary
  rule-set-preparation: primary
  legal-semantic-auditor: semantic-primary
  response-transform: fallback

# Ordered fallback chain per route (optional; cycles are rejected).
fallbacks:
  primary: [fallback, fallback-01, fallback-02]
  semantic-primary: [fallback, fallback-01, semantic-final]
